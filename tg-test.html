<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG widget test (temporary)</title>
</head>
<body style="font-family:sans-serif;padding:20px">
<h1>Telegram widget test</h1>
<p id="status">waiting…</p>
<script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="CyborgStudioMMBot" data-size="large" data-onauth="onTelegramAuth(user)" data-request-access="write"></script>
<script>
function onTelegramAuth(user){document.getElementById('status').textContent='AUTHED: '+JSON.stringify(user)}
setTimeout(function(){
  var f=document.querySelector('iframe[src*="oauth.telegram.org"]');
  document.getElementById('status').textContent = f ? 'RENDERED: iframe found' : 'NOT RENDERED: no oauth iframe after 10s';
},10000);
</script>
</body>
</html>
