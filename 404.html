<!DOCTYPE html>

<style>

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 50% -10%,#12233d 0%,var(--bg) 60%);color:var(--txt);

  a.btn{display:inline-block;padding:12px 26px;border-radius:999px;text-decoration:none;font-weight:700;

  </div>
  <script>setTimeout(function(){location.replace('https://cyborgstudiomm.com/')},3000);</script>
